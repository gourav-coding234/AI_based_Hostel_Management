<!doctype html>
<html lang="en">

         corners; the CSS then pads content back with env(safe-area-inset-*).
         Zoom is deliberately NOT disabled — blocking it fails accessibility. -->

    <meta name="theme-color" content="#0e1b2c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />

    <title>GCEKJR Hostel Portal | AI-Based Smart Hostel Management</title>
    <meta
      name="description"
      content="Official smart hostel management portal for Government College of Engineering, Keonjhar. Role-based dashboards for students, parents, wardens, security and administrators."
    />
    <meta name="author" content="Government College of Engineering, Keonjhar" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GCEKJR Hostel Portal" />

      property="og:description"
      content="Role-based smart hostel management for students, parents, wardens, security and administrators."
    />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Hostel Portal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
